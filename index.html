<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Echoframe</title>

  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="manifest.json"/>

</head>

<body>

<!-- Opening -->
<div id="splash">
  <div class="logo">Echoframe</div>
</div>

<!-- Main -->
<div id="app" class="hidden">

  <!-- 星空 + 森林 -->
  <canvas id="bg"></canvas>

  <!-- 情緒顏色 -->
  <div class="emotion-picker">
    <div class="color yellow" data-emotion="happy"></div>
    <div class="color blue" data-emotion="calm"></div>
    <div class="color gray" data-emotion="sad"></div>
    <div class="color red" data-emotion="stress"></div>
  </div>

  <!-- 畫布 -->
  <canvas id="draw"></canvas>

  <!-- Actions -->
  <div class="actions">
    <button id="save">Share</button>
    <button id="galleryBtn">Global</button>
  </div>

</div>

<!-- Gallery -->
<div id="gallery" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
