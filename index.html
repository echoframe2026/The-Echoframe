<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoframe</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  overflow: hidden;
  background: black;
}

/* 🌌 開場動畫 */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  z-index: 10;
  animation: fadeOut 4s forwards 2s;
}

#logo {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid white;
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeIn 2s forwards;
}

#title {
  font-size: 28px;
  opacity: 0;
  animation: fadeIn 2s forwards 0.5s;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

/* 🌳 心靈森林 */
#app {
  width: 100%;
  height: 100vh;
  background: linear-gradient(#0f2027, #203a43, #2c5364);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.forest {
  width: 100%;
  height: 60%;
  background: radial-gradient(circle, rgba(255,255,255,0.1), transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 20px;
}

/* 🎨 情緒選擇 */
.moods {
  display: flex;
  gap: 15px;
  margin-top: 20px;
}

.color {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
}

/* 🧠 AI */
#ai {
  margin-top: 20px;
  color: white;
  text-align: center;
}

/* 🎨 畫布 */
canvas {
  background: white;
  border-radius: 10px;
  margin-top: 10px;
}

/* 🌍 全球畫布 */
#global {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  background: #111;
  width: 100%;
  height: 100%;
  overflow: auto;
  color: white;
}

.post {
  border: 1px solid #444;
  margin: 10px;
  padding: 10px;
}
</style>
</head>

<body>

<!-- 🎬 開場 -->
<div id="intro">
  <div id="logo"></div>
  <div id="title">Echoframe</div>
</div>

<!-- 🌳 主畫面 -->
<div id="app">
  <div class="forest" id="forest">🌳 Your Mind Space</div>

  <!-- 🎨 顏色選情緒 -->
  <div class="moods">
    <div class="color" style="background: #FFD700" onclick="setMood('happy')"></div>
    <div class="color" style="background: #87CEFA" onclick="setMood('calm')"></div>
    <div class="color" style="background: #555" onclick="setMood('sad')"></div>
    <div class="color" style="background: #FF6B6B" onclick="setMood('stress')"></div>
  </div>

  <!-- 🧠 AI -->
  <div id="ai">Choose your feeling</div>

  <!-- 🎨 畫布 -->
  <canvas id="canvas" width="300" height="200"></canvas>

  <button onclick="saveDrawing()">Share to Global Canvas</button>
  <button onclick="openGlobal()">🌍 Global Canvas</button>
</div>

<!-- 🌍 全球畫布 -->
<div id="global">
  <h2>🌍 Global Canvas</h2>
  <div id="gallery"></div>
  <button onclick="closeGlobal()">Back</button>
</div>

<script>
/* 🌳 Mood 控制 */
function setMood(mood) {
  let forest = document.getElementById("forest");
  let ai = document.getElementById("ai");

  if (mood === "happy") {
    forest.style.background = "linear-gradient(#fceabb, #f8b500)";
    ai.innerText = "Your forest feels bright 🌞";
  }
  if (mood === "calm") {
    forest.style.background = "linear-gradient(#89f7fe, #66a6ff)";
    ai.innerText = "Your forest is peaceful 🌊";
  }
  if (mood === "sad") {
    forest.style.background = "linear-gradient(#434343, #000000)";
    ai.innerText = "It's okay to feel this 🌧️";
  }
  if (mood === "stress") {
    forest.style.background = "linear-gradient(#ff6a6a, #ff0000)";
    ai.innerText = "Take a breath 🌬️";
  }
}

/* 🎨 畫畫功能 */
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let drawing = false;

canvas.addEventListener("mousedown", () => drawing = true);
canvas.addEventListener("mouseup", () => drawing = false);

canvas.addEventListener("mousemove", draw);

function draw(e) {
  if (!drawing) return;
  ctx.fillRect(e.offsetX, e.offsetY, 3, 3);
}

/* 📤 分享 */
function saveDrawing() {
  let data = canvas.toDataURL();
  let gallery = document.getElementById("gallery");

  let div = document.createElement("div");
  div.className = "post";

  let img = document.createElement("img");
  img.src = data;
  img.width = 200;

  div.appendChild(img);
  gallery.appendChild(div);
}

/* 🌍 Global */
function openGlobal() {
  document.getElementById("global").style.display = "block";
}

function closeGlobal() {
  document.getElementById("global").style.display = "none";
}
</script>

</body>
</html>
