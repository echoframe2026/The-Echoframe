<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoframe</title>

<style>
body {
  margin: 0;
  font-family: "Helvetica Neue", sans-serif;
  background: radial-gradient(circle at center, #1e2a38, #0f1720);
  overflow: hidden;
  color: white;
}

/* ===== 開場動畫 ===== */
#intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  animation: fadeOut 3s forwards 3s;
}

.logo {
  font-size: 42px;
  letter-spacing: 4px;
  opacity: 0;
  animation: fadeIn 2s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

/* ===== 主畫面 ===== */
#app {
  display: none;
  padding: 20px;
  text-align: center;
}

.mood-btn {
  padding: 10px 18px;
  margin: 5px;
  border: none;
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  color: white;
}

/* ===== 森林背景 ===== */
.forest {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at bottom, #2e4d3c, #0f1720);
  z-index: -1;
}

/* ===== AI畫布 ===== */
canvas {
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  margin-top: 20px;
}

/* ===== AI畫 output ===== */
#aiArt {
  margin-top: 20px;
  font-size: 20px;
}

/* ===== 粒子 ===== */
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: white;
  border-radius: 50%;
  opacity: 0.5;
  animation: float 6s infinite;
}

@keyframes float {
  0% { transform: translateY(0px);}
  100% { transform: translateY(-800px);}
}

</style>
</head>

<body>

<!-- ===== 開場 ===== -->
<div id="intro">
  <div class="logo">ECHOFRAME</div>
</div>

<!-- ===== 森林背景 ===== -->
<div class="forest"></div>

<!-- ===== 主 App ===== -->
<div id="app">
  <h2>How do you feel today?</h2>

  <button class="mood-btn" onclick="setMood('calm')">Calm</button>
  <button class="mood-btn" onclick="setMood('stress')">Stress</button>
  <button class="mood-btn" onclick="setMood('happy')">Happy</button>

  <br>

  <canvas id="draw" width="300" height="200"></canvas>

  <div id="aiArt"></div>

  <br>
  <button onclick="share()">Share to Global Canvas</button>
</div>

<script>

/* ===== 入場動畫轉場 ===== */
setTimeout(() => {
  document.getElementById("app").style.display = "block";
}, 3000);

/* ===== Mood系統 ===== */
function setMood(mood) {
  if(mood === 'calm'){
    document.body.style.background = "linear-gradient(#2c5364,#203a43,#0f2027)";
  }
  if(mood === 'stress'){
    document.body.style.background = "linear-gradient(#3a1c71,#d76d77,#ffaf7b)";
  }
  if(mood === 'happy'){
    document.body.style.background = "linear-gradient(#ffecd2,#fcb69f)";
  }

  generateAIArt(mood);
}

/* ===== AI 視覺回應（重點🔥） ===== */
function generateAIArt(mood){
  let art = "";

  if(mood === "calm"){
    art = "🌊 soft waves drifting...";
  }
  if(mood === "stress"){
    art = "🌧 fragmented storm dissolving...";
  }
  if(mood === "happy"){
    art = "☀️ glowing light expanding...";
  }

  document.getElementById("aiArt").innerHTML = art;
}

/* ===== 畫畫功能 ===== */
let canvas = document.getElementById("draw");
let ctx = canvas.getContext("2d");
let drawing = false;

canvas.addEventListener("mousedown", () => drawing = true);
canvas.addEventListener("mouseup", () => drawing = false);
canvas.addEventListener("mousemove", draw);

function draw(e){
  if(!drawing) return;
  ctx.fillStyle = "white";
  ctx.fillRect(e.offsetX, e.offsetY, 3, 3);
}

/* ===== Share ===== */
function share(){
  alert("Shared to Global Canvas 🌍");
}

/* ===== 粒子效果 ===== */
for(let i=0;i<40;i++){
  let p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random()*100+"%";
  p.style.top = Math.random()*100+"%";
  document.body.appendChild(p);
}

</script>

</body>
</html>
