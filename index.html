<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoframe</title>

<style>
body {
    margin:0;
    font-family: sans-serif;
    background:#0f172a;
    color:white;
    overflow:hidden;
}

/* Opening */
#intro{
    position:fixed;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:radial-gradient(circle,#1e293b,#020617);
    animation:fadeOut 3s forwards;
    animation-delay:2s;
}

#logo{
    font-size:40px;
    letter-spacing:4px;
    opacity:0;
    animation:fadeIn 2s forwards;
}

@keyframes fadeIn{to{opacity:1}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

/* App */
#app{
    opacity:0;
    animation:showApp 2s forwards;
    animation-delay:3s;
}
@keyframes showApp{to{opacity:1}}

/* Background particles */
canvas{
    position:absolute;
    top:0;
    left:0;
}

/* UI */
#ui{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
}

button{
    padding:10px 14px;
    margin:5px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    color:white;
}

/* AI text */
#ai{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    font-size:14px;
    opacity:0.8;
}

/* Emotion tracker */
#tracker{
    position:absolute;
    right:10px;
    bottom:100px;
    font-size:12px;
    opacity:0.7;
}
</style>
</head>

<body>

<div id="intro">
    <div id="logo">ECHOF R A M E</div>
</div>

<div id="app">

<canvas id="bg"></canvas>

<div id="ai">AI is listening...</div>

<div id="tracker">Mood log: none</div>

<div id="ui">
    <button onclick="setMood('calm')">Calm</button>
    <button onclick="setMood('stress')">Stress</button>
    <button onclick="startVoice()">Voice</button>
</div>

</div>

<script>

/* ===== Particle Background ===== */
let canvas = document.getElementById("bg");
let ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<80;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2,
        dx:(Math.random()-0.5)*0.5,
        dy:(Math.random()-0.5)*0.5
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";

    particles.forEach(p=>{
        p.x+=p.dx;
        p.y+=p.dy;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(animate);
}
animate();

/* ===== Mood System ===== */
let tracker = [];

function setMood(mood){
    let ai = document.getElementById("ai");

    tracker.push(mood);
    document.getElementById("tracker").innerText =
        "Mood log: " + tracker.join(", ");

    if(mood==="calm"){
        ai.innerText="AI: You seem calm. Stay present.";
    }else{
        ai.innerText="AI: Stress detected. Try breathing.";
    }
}

/* ===== Voice AI ===== */
function startVoice(){
    let ai = document.getElementById("ai");

    if (!('webkitSpeechRecognition' in window)) {
        ai.innerText = "Voice not supported";
        return;
    }

    let recognition = new webkitSpeechRecognition();
    recognition.lang = "en-US";

    recognition.start();

    recognition.onresult = function(event){
        let text = event.results[0][0].transcript;
        ai.innerText = "You said: " + text;

        // simple AI response
        if(text.includes("sad")){
            ai.innerText += " | AI: I'm here with you.";
        }else{
            ai.innerText += " | AI: I understand.";
        }
    }
}

/* ===== Swipe Effect ===== */
let startX=0;
document.addEventListener("touchstart",e=>{
    startX=e.touches[0].clientX;
});

document.addEventListener("touchend",e=>{
    let endX=e.changedTouches[0].clientX;
    if(endX-startX>50){
        document.body.style.background="#1e293b";
    }
});

</script>

</body>
</html>
