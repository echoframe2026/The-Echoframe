<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoframe</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    overflow: hidden;
    background: radial-gradient(circle at center, #1e1e2f, #0c0c1a);
    color: white;
}

/* 🌌 星空動畫背景 */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: url('https://www.transparenttextures.com/patterns/stardust.png');
    animation: moveStars 60s linear infinite;
    opacity: 0.3;
}

@keyframes moveStars {
    from { transform: translate(0,0); }
    to { transform: translate(-200px,-200px); }
}

/* 🌀 開場動畫 */
#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #2a2a4a, #0c0c1a);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    letter-spacing: 3px;
    animation: fadeOut 2.5s ease forwards;
}

@keyframes fadeOut {
    0% {opacity:1;}
    70% {opacity:1;}
    100% {opacity:0; visibility:hidden;}
}

/* 主內容 */
.container {
    padding: 20px;
    text-align: center;
}

/* 卡片風格 */
.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 20px;
    margin-top: 20px;
}

/* 按鈕 */
.mood-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: none;
    margin: 15px;
    transition: 0.3s;
}

.mood-btn:hover {
    transform: scale(1.2);
}

/* 畫布 */
canvas {
    background: rgba(255,255,255,0.9);
    border-radius: 15px;
    width: 90%;
    height: 220px;
}

/* AI box */
.ai-box {
    margin-top: 15px;
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,0.1);
}

/* 燈號 */
.light {
    font-size: 70px;
}

/* 隱藏 */
.screen { display:none; }
.active { display:block; }

button {
    padding: 12px 20px;
    border-radius: 20px;
    border: none;
    margin-top: 15px;
}
</style>

</head>

<body>

<!-- 開場 -->
<div id="intro">Echoframe</div>

<div class="container">

<!-- Step 1 -->
<div class="screen active" id="step1">
    <div class="card">
        <h2>How do you feel today?</h2>

        <button class="mood-btn" style="background:#FFD93D" onclick="nextStep('happy')"></button>
        <button class="mood-btn" style="background:#6C8EF5" onclick="nextStep('sad')"></button>
        <button class="mood-btn" style="background:#999" onclick="nextStep('stress')"></button>

        <p>Express without words</p>
    </div>
</div>

<!-- Step 2 -->
<div class="screen" id="step2">
    <div class="card">
        <h2>Express your emotion</h2>

        <canvas id="canvas"></canvas>

        <button onclick="nextStep()">Continue</button>
    </div>
</div>

<!-- Step 3 -->
<div class="screen" id="step3">
    <div class="card">
        <h2>Your Emotional State</h2>

        <div id="light" class="light">🟢</div>

        <div class="ai-box" id="aiText">
            AI is reflecting...
        </div>

        <button onclick="restart()">Restart</button>
    </div>
</div>

</div>

<script>
let mood = "happy";

// 開場延遲顯示主畫面
setTimeout(() => {
    document.getElementById("intro").style.display = "none";
}, 2500);

function nextStep(selectedMood) {
    if (selectedMood) mood = selectedMood;

    document.querySelector('.active').classList.remove('active');

    if (selectedMood) {
        document.getElementById('step2').classList.add('active');
    } else {
        document.getElementById('step3').classList.add('active');
        updateLight();
        simulateAI();
    }
}

function restart() {
    location.reload();
}

function updateLight() {
    let light = document.getElementById("light");

    if (mood === "happy") light.innerHTML = "🟢";
    if (mood === "stress") light.innerHTML = "🟡";
    if (mood === "sad") light.innerHTML = "🔴";
}

function simulateAI() {
    let text = document.getElementById("aiText");

    setTimeout(() => {
        if (mood === "happy") text.innerHTML = "Your energy feels calm and bright.";
        if (mood === "stress") text.innerHTML = "Take a breath. You're doing enough.";
        if (mood === "sad") text.innerHTML = "It's okay to feel this. You're not alone.";
    }, 1200);
}

/* 畫畫 */
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth * 0.9;
canvas.height = 220;

let drawing = false;

canvas.addEventListener("touchstart", () => drawing = true);
canvas.addEventListener("touchend", () => drawing = false);
canvas.addEventListener("touchmove", drawTouch);

function drawTouch(e) {
    if (!drawing) return;
    let rect = canvas.getBoundingClientRect();
    let x = e.touches[0].clientX - rect.left;
    let y = e.touches[0].clientY - rect.top;
    ctx.fillRect(x, y, 4, 4);
}
</script>

</body>
</html>
