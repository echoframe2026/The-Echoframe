<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoframe</title>

<style>
body {
  margin:0;
  font-family: -apple-system;
  background: black;
  overflow:hidden;
}

/* 🌌 Intro */
#intro {
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:10;
  animation:fadeOut 3s forwards 2s;
}
#logo {
  width:90px;
  height:90px;
  border:2px solid white;
  border-radius:50%;
  margin-bottom:15px;
  animation:fadeIn 2s;
}
#title {
  font-size:28px;
  animation:fadeIn 2s;
}
@keyframes fadeIn {from{opacity:0} to{opacity:1}}
@keyframes fadeOut {to{opacity:0;visibility:hidden}}

/* 🌳 Forest */
#forest {
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:1s;
  background:linear-gradient(#1a2a33,#2c5364);
}

/* 🌫 atmosphere */
.glow {
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  background:rgba(255,255,255,0.1);
  filter:blur(80px);
}

/* 🎨 mood */
.colors {
  display:flex;
  gap:15px;
  position:absolute;
  bottom:30px;
}
.color {
  width:45px;
  height:45px;
  border-radius:50%;
  cursor:pointer;
  border:2px solid white;
}

/* 🎨 canvas */
#canvas {
  background:white;
  border-radius:12px;
  margin-top:20px;
}

/* 🌍 global */
#global {
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  overflow:auto;
}
.post img {
  width:100%;
  border-radius:10px;
}

/* buttons */
button {
  margin-top:10px;
  padding:8px 15px;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- intro -->
<div id="intro">
  <div id="logo"></div>
  <div id="title">Echoframe</div>
</div>

<!-- 🌳 forest -->
<div id="forest">
  <div class="glow"></div>

  <!-- 🎨 canvas -->
  <canvas id="canvas" width="300" height="200"></canvas>

  <button onclick="save()">Share</button>
  <button onclick="openGlobal()">🌍</button>

  <!-- 🎨 顏色情緒 -->
  <div class="colors">
    <div class="color" style="background:#FFD700" onclick="mood(1)"></div>
    <div class="color" style="background:#87CEFA" onclick="mood(2)"></div>
    <div class="color" style="background:#555" onclick="mood(3)"></div>
    <div class="color" style="background:#FF4C4C" onclick="mood(4)"></div>
  </div>
</div>

<!-- 🌍 gallery -->
<div id="global">
  <h2 style="text-align:center">Global Canvas</h2>
  <div id="gallery"></div>
  <button onclick="closeGlobal()">Back</button>
</div>

<script>
/* 🌳 mood change (REAL forest effect) */
function mood(type){
  let f=document.getElementById("forest");

  if(type==1){
    f.style.background="linear-gradient(#fceabb,#f8b500)";
  }
  if(type==2){
    f.style.background="linear-gradient(#89f7fe,#66a6ff)";
  }
  if(type==3){
    f.style.background="linear-gradient(#232526,#414345)";
  }
  if(type==4){
    f.style.background="linear-gradient(#ff416c,#ff4b2b)";
  }
}

/* 🎨 DRAW (ipad supported) */
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
let draw=false;

canvas.addEventListener("touchstart",()=>draw=true);
canvas.addEventListener("touchend",()=>draw=false);
canvas.addEventListener("touchmove",(e)=>{
  if(!draw) return;
  let rect=canvas.getBoundingClientRect();
  let x=e.touches[0].clientX-rect.left;
  let y=e.touches[0].clientY-rect.top;
  ctx.fillRect(x,y,3,3);
});

/* mouse */
canvas.onmousedown=()=>draw=true;
canvas.onmouseup=()=>draw=false;
canvas.onmousemove=(e)=>{
  if(!draw) return;
  ctx.fillRect(e.offsetX,e.offsetY,3,3);
}

/* 🌍 SAVE (REAL STORAGE) */
function save(){
  let data=canvas.toDataURL();
  let arr=JSON.parse(localStorage.getItem("art")||"[]");
  arr.push(data);
  localStorage.setItem("art",JSON.stringify(arr));
  alert("Saved to global canvas");
}

/* 🌍 OPEN GALLERY */
function openGlobal(){
  let g=document.getElementById("gallery");
  g.innerHTML="";
  let arr=JSON.parse(localStorage.getItem("art")||"[]");

  arr.forEach(img=>{
    let div=document.createElement("div");
    div.className="post";

    let i=document.createElement("img");
    i.src=img;

    div.appendChild(i);
    g.appendChild(div);
  });

  document.getElementById("global").style.display="block";
}

/* close */
function closeGlobal(){
  document.getElementById("global").style.display="none";
}
</script>

</body>
</html>
