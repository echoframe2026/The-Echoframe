<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoframe</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  overflow:hidden;
  background:black;
}

/* 🎬 Intro */
#intro{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:10;
  animation:fadeOut 3s forwards 2s;
}

#logo{
  width:80px;
  height:80px;
  border:2px solid white;
  border-radius:50%;
  margin-bottom:15px;
  opacity:0;
  animation:fadeIn 2s forwards;
}

#title{
  font-size:28px;
  opacity:0;
  animation:fadeIn 2s forwards 0.5s;
}

@keyframes fadeIn{
  to{opacity:1;}
}
@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

/* 🌳 Forest */
#forest{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:1s;
  background:linear-gradient(#1a2a33,#2c5364);
  position:relative;
}

/* 🌫 glow */
.glow{
  position:absolute;
  width:300px;
  height:300px;
  background:rgba(255,255,255,0.08);
  border-radius:50%;
  filter:blur(80px);
}

/* 🎨 canvas */
canvas{
  background:white;
  border-radius:12px;
}

/* 🎨 mood */
.colors{
  position:absolute;
  bottom:30px;
  display:flex;
  gap:15px;
}
.color{
  width:45px;
  height:45px;
  border-radius:50%;
  border:2px solid white;
}

/* 🌍 global */
#global{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:#111;
  color:white;
  overflow:auto;
}

.post img{
  width:100%;
  border-radius:10px;
}

/* buttons */
button{
  margin-top:10px;
  padding:8px 15px;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- 🎬 intro -->
<div id="intro">
  <div id="logo"></div>
  <div id="title">Echoframe</div>
</div>

<!-- 🌳 forest -->
<div id="forest">
  <div class="glow"></div>

  <canvas id="canvas" width="300" height="200"></canvas>

  <button onclick="save()">Share</button>
  <button onclick="openGlobal()">🌍</button>

  <!-- 🎨 顏色選情緒 -->
  <div class="colors">
    <div class="color" style="background:#FFD700" onclick="mood(1)"></div>
    <div class="color" style="background:#87CEFA" onclick="mood(2)"></div>
    <div class="color" style="background:#555" onclick="mood(3)"></div>
    <div class="color" style="background:#FF4C4C" onclick="mood(4)"></div>
  </div>
</div>

<!-- 🌍 gallery -->
<div id="global">
  <h2 style="text-align:center">Global Canvas</h2>
  <div id="gallery"></div>
  <button onclick="closeGlobal()">Back</button>
</div>

<script>
/* 🌳 情緒森林 */
function mood(type){
  let f=document.getElementById("forest");

  if(type==1){
    f.style.background="linear-gradient(#fceabb,#f8b500)";
  }
  if(type==2){
    f.style.background="linear-gradient(#89f7fe,#66a6ff)";
  }
  if(type==3){
    f.style.background="linear-gradient(#232526,#414345)";
  }
  if(type==4){
    f.style.background="linear-gradient(#ff416c,#ff4b2b)";
  }
}

/* 🎨 順滑畫布（已修復） */
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

ctx.lineWidth = 3;
ctx.lineCap = "round";

let drawing = false;

/* touch */
canvas.addEventListener("touchstart", (e)=>{
  drawing=true;
  draw(e);
});
canvas.addEventListener("touchend", ()=>{
  drawing=false;
  ctx.beginPath();
});
canvas.addEventListener("touchmove", (e)=>{
  e.preventDefault();
  draw(e);
});

/* mouse */
canvas.addEventListener("mousedown", ()=>drawing=true);
canvas.addEventListener("mouseup", ()=>{
  drawing=false;
  ctx.beginPath();
});
canvas.addEventListener("mousemove", draw);

function draw(e){
  if(!drawing) return;

  let rect = canvas.getBoundingClientRect();
  let x,y;

  if(e.touches){
    x = e.touches[0].clientX - rect.left;
    y = e.touches[0].clientY - rect.top;
  }else{
    x = e.offsetX;
    y = e.offsetY;
  }

  ctx.lineTo(x,y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x,y);
}

/* 🌍 儲存 */
function save(){
  let data = canvas.toDataURL();
  let arr = JSON.parse(localStorage.getItem("art")||"[]");
  arr.push(data);
  localStorage.setItem("art", JSON.stringify(arr));
  alert("Saved");
}

/* 🌍 畫廊 */
function openGlobal(){
  let gallery = document.getElementById("gallery");
  gallery.innerHTML="";

  let arr = JSON.parse(localStorage.getItem("art")||"[]");

  arr.forEach(img=>{
    let div=document.createElement("div");
    div.className="post";

    let i=document.createElement("img");
    i.src=img;

    div.appendChild(i);
    gallery.appendChild(div);
  });

  document.getElementById("global").style.display="block";
}

function closeGlobal(){
  document.getElementById("global").style.display="none";
}
</script>

</body>
</html>
